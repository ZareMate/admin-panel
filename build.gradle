plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
version = '2.0.0'
group = 'com.zaremate.admin_panel'
base { archivesName = 'admin_panel' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Icon Exporter PNGs live in src/resources/icons and are bundled in the mod JAR.
sourceSets.main.resources.srcDir 'src/resources'
runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    server { argument '--nogui' }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
def adminGuiJar = providers.gradleProperty('adminGuiJar').getOrElse('../admin-gui/build/libs/admin_gui-2.0.0.jar')
def punishJar = providers.gradleProperty('punishJar').getOrElse('../punish/build/libs/punish-1.0.0.jar')
dependencies {
    implementation 'net.neoforged:neoforge:21.1.249'
    compileOnly files(adminGuiJar, punishJar)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('panelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.PanelTest'
    jvmArgs '-ea'
}
// This project uses an executable HTTP integration suite instead of a JUnit engine.
tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn 'panelTest' }
tasks.register('browserTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.BrowserTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'browserTest' }
tasks.register('discordTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.DiscordTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'discordTest' }
tasks.register('iconTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.ItemIconsTest'
    jvmArgs '-ea', '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn 'iconTest' }
tasks.register('discordHttpTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.DiscordHttpTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'discordHttpTest' }
tasks.register('iconFallbackTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.IconFallbackTest'
    jvmArgs '--limit-modules', 'java.base,java.logging'
}
tasks.named('check') { dependsOn 'iconFallbackTest' }
tasks.register('installedIconTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.InstalledIconTest'
    args providers.gradleProperty('modAssetsPath').getOrElse('run/server/mods')
    jvmArgs '-Djava.awt.headless=true'
}

tasks.register('firstRunSetupTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.FirstRunSetupTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'firstRunSetupTest' }

tasks.register('rankConfigEditorTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.RankConfigEditorTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'rankConfigEditorTest' }

// Standalone React/TypeScript web app; no Java web-service JAR is produced.
tasks.named('jar') { exclude 'web/**', 'icons/**' }
tasks.register('webInstall', Exec) {
    workingDir 'web-server'
    commandLine 'npm', 'ci'
    inputs.files('web-server/package.json', 'web-server/package-lock.json')
    outputs.dir('web-server/node_modules')
}
tasks.register('webBuild', Exec) {
    dependsOn 'webInstall'
    workingDir 'web-server'
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree('web-server') { exclude 'node_modules/**', 'dist/**', 'data/**', 'public/**', '.env' })
    inputs.files(fileTree('src/main/resources/icons'), fileTree('src/resources/icons'))
    outputs.dirs('web-server/dist', 'web-server/public/icons')
}
tasks.register('webTest', Exec) {
    dependsOn 'webBuild', testClasses
    workingDir 'web-server'
    commandLine 'npm', 'test'
    doFirst { environment 'JAVA_BRIDGE_CLASSPATH', sourceSets.test.runtimeClasspath.asPath }
}
tasks.register('webTypecheck', Exec) {
    dependsOn 'webInstall'
    workingDir 'web-server'
    commandLine 'npm', 'run', 'typecheck'
}
tasks.register('webDist', Zip) {
    dependsOn 'webBuild'
    archiveFileName = "admin_panel-${project.version}-web.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('web-server') {
        include 'dist/**', 'public/icons/**', 'scripts/setup.mjs', 'package.json', 'package-lock.json', '.env.example', 'admin-panel.example.properties', 'README.md'
    }
}
tasks.named('assemble') { dependsOn 'webDist' }
tasks.named('check') { dependsOn 'webTest', 'webTypecheck' }
