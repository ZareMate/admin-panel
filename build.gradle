plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
version = '2.0.0'
group = 'com.zaremate.admin_panel'
base { archivesName = 'admin_panel' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Icon exports under web-server/assets/icons belong to the Node app only.
runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    server { argument '--nogui' }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
def adminGuiJar = providers.gradleProperty('adminGuiJar').getOrElse('../admin-gui/build/libs/admin_gui-2.0.0.jar')
def punishJar = providers.gradleProperty('punishJar').getOrElse('../punish/build/libs/punish-1.0.0.jar')
dependencies {
    implementation 'net.neoforged:neoforge:21.1.249'
    compileOnly files(adminGuiJar, punishJar)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// Executable Java contract tests and real Node/React integration tests replace JUnit.
tasks.named('test') { enabled = false }
tasks.register('bridgeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zaremate.admin_panel.BridgeTest'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'bridgeTest' }

// Standalone React/TypeScript web app; no Java web-service JAR is produced.
tasks.named('jar') { exclude 'icons/**' }
tasks.register('webInstall', Exec) {
    workingDir 'web-server'
    commandLine 'npm', 'ci'
    inputs.files('web-server/package.json', 'web-server/package-lock.json')
    outputs.dir('web-server/node_modules')
}
tasks.register('webBuild', Exec) {
    dependsOn 'webInstall'
    workingDir 'web-server'
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree('web-server') { exclude 'node_modules/**', 'dist/**', 'data/**', 'public/**', '.env' })
    outputs.dirs('web-server/dist', 'web-server/public/icons')
}
tasks.register('webTest', Exec) {
    dependsOn 'webBuild', testClasses
    workingDir 'web-server'
    commandLine 'npm', 'test'
    doFirst { environment 'JAVA_BRIDGE_CLASSPATH', sourceSets.test.runtimeClasspath.asPath }
}
tasks.register('webTypecheck', Exec) {
    dependsOn 'webInstall'
    workingDir 'web-server'
    commandLine 'npm', 'run', 'typecheck'
}
tasks.register('webDist', Zip) {
    dependsOn 'webBuild'
    archiveFileName = "admin_panel-${project.version}-web.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('web-server') {
        include 'dist/**', 'public/icons/**', 'scripts/setup.mjs', 'package.json', 'package-lock.json', '.env.example', 'admin-panel.example.properties', 'README.md'
    }
}
tasks.named('assemble') { dependsOn 'webDist' }
tasks.named('check') { dependsOn 'webTest', 'webTypecheck' }

// Catch stale embedded-server classes/resources accidentally returning to the deployable mod.
tasks.register('verifyModJar') {
    dependsOn 'jar'
    doLast {
        def retired = ['PanelServer', 'Auth', 'Audit', 'Config', 'DiscordApi', 'DiscordAuth',
                       'DiscordSettings', 'HttpDiscordApi', 'FirstRunSetup', 'RankConfigEditor',
                       'ItemIcons', 'ModAssets', 'ModelPreview', 'PngPreview', 'SkinCache']
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                def simple = entry.name.tokenize('/').last().split('[.$]')[0]
                if (retired.contains(simple) || entry.name.startsWith('web/') || entry.name.startsWith('icons/') || entry.name.endsWith('Test.class') || entry.name.endsWith('Fixture.class') || entry.name == 'admin-panel-default.properties') {
                    throw new GradleException("Unexpected legacy or test content in mod jar: ${entry.name}")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyModJar' }
