# Set enabled=true after configuring the Discord application.
enabled=false
bind=0.0.0.0
port=3000
origin=http://localhost:3000
allow-insecure-http=false

# Discord mode disables all local password logins (including existing user.* entries).
auth.mode=discord
discord.client-id=
# Alternatively set the ADMIN_PANEL_DISCORD_CLIENT_SECRET environment variable.
discord.client-secret=
discord.guild-id=
# Register <origin>/api/auth/discord/callback in your Discord application's OAuth2 redirects.

# Highest first: the FIRST matching rank determines access, regardless of Discord role order.
discord.rank-order=dev,owner,admin,mod,trial-mod,helper,trial-helper
# Explicit permissions. An empty list denies login. Highest matching rank wins.
discord.rank.dev.role-id=
discord.rank.dev.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios,notes.add,notes.edit,notes.remove,punish.warn,punish.kick,punish.mute,tab.audit,punish.ban,punish.offense,punish.remove,punish.revoke,access.manage
discord.rank.owner.role-id=
discord.rank.owner.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios,notes.add,notes.edit,notes.remove,punish.warn,punish.kick,punish.mute,tab.audit,punish.ban,punish.offense,punish.remove,punish.revoke,access.manage
discord.rank.admin.role-id=
discord.rank.admin.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios,notes.add,notes.edit,notes.remove,punish.warn,punish.kick,punish.mute,tab.audit,punish.ban,punish.offense,punish.remove,punish.revoke
discord.rank.mod.role-id=
discord.rank.mod.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios,notes.add,notes.edit,notes.remove,punish.warn,punish.kick,punish.mute
discord.rank.trial-mod.role-id=
discord.rank.trial-mod.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios,notes.add,notes.edit,notes.remove,punish.warn,punish.kick,punish.mute
discord.rank.helper.role-id=
discord.rank.helper.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios
discord.rank.trial-helper.role-id=
discord.rank.trial-helper.permissions=panel.access,tab.players,tab.overview,tab.cases,tab.notes,tab.security,tab.inventory,tab.enderChest,tab.curios

# Optional trusted Minecraft UUID mapping for existing in-game note ownership:
# discord.minecraft.DISCORD_USER_ID=MINECRAFT_UUID
# Without a mapping, the account gets a stable Discord-specific note-author UUID.
